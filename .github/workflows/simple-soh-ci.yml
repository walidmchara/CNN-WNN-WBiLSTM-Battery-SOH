name: NASA CALCE simple SOH validation
on:
  push:
    paths:
      - 'simple_soh/**'
      - 'tests/test_nasa_original_mat.py'
      - 'configs/simple_soh_*.json'
      - 'tests/test_simple_soh.py'
      - 'requirements.txt'
      - '.github/workflows/simple-soh-ci.yml'
  pull_request:
    paths:
      - 'simple_soh/**'
      - 'configs/simple_soh_*.json'
      - 'tests/test_simple_soh.py'
      - 'requirements.txt'
      - '.github/workflows/simple-soh-ci.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install -q "torch>=2.1" "numpy>=1.24" "pandas>=2.0" "scikit-learn>=1.3" "matplotlib>=3.7" "pytest>=7.0"
      - name: Verify real dataset splits, labels and model gradients
        run: python -m pytest -q tests/test_simple_soh.py
      - name: Verify original NASA MAT parser and 12-battery source inventory
        run: python -m pytest -q tests/test_nasa_original_mat.py
      - name: Test NASA one-epoch fit and held-out B0018 evaluation
        run: |
          python -m simple_soh.run --config configs/simple_soh_nasa.json --model gru --epochs 1 --device cpu --checkpoint-root "${RUNNER_TEMP}/nasa_checkpoints" --output-root "${RUNNER_TEMP}/nasa_results"
      - name: Test CALCE one-epoch fit and held-out CS2_38 evaluation
        run: |
          python -m simple_soh.run --config configs/simple_soh_calce.json --model lstm --epochs 1 --device cpu --checkpoint-root "${RUNNER_TEMP}/calce_checkpoints" --output-root "${RUNNER_TEMP}/calce_results"
      - name: Restore both completed full-model checkpoints and reproduce test evaluation
        run: |
          python -m simple_soh.run --config configs/simple_soh_nasa.json --model gru --epochs 1 --device cpu --resume --checkpoint-root "${RUNNER_TEMP}/nasa_checkpoints" --output-root "${RUNNER_TEMP}/nasa_results"
          python -m simple_soh.run --config configs/simple_soh_calce.json --model lstm --epochs 1 --device cpu --resume --checkpoint-root "${RUNNER_TEMP}/calce_checkpoints" --output-root "${RUNNER_TEMP}/calce_results"
      - name: Confirm outputs created; ephemeral CI trials are not published scores
        run: |
          test -f "${RUNNER_TEMP}/nasa_results/nasa_gru_lb12_e1_seed42/metrics.json"
          test -f "${RUNNER_TEMP}/calce_results/calce_lstm_lb12_e1_seed42/metrics.json"
